
name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG and GIF
        uses: Platane/snk@v3
        with:
          github_user_name: Alvina1507
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%23161b22,%23444444,%23777777,%23aaaaaa,%23ffffff
            dist/github-contribution-grid-snake-dark.gif?color_snake=%23ffffff&color_dots=%23161b22,%23444444,%23777777,%23aaaaaa,%23ffffff&color_background=%230d1117

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
