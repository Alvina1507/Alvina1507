
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVG and GIF
        uses: Platane/snk@v3
        with:
          github_user_name: Alvina1507
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffffff&color_dots=%230d1117,%23242424,%23444444,%23777777,%23ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%230d1117,%23242424,%23444444,%23777777,%23ffffff
            dist/github-contribution-grid-snake.gif?color_snake=%23ffffff&color_dots=%230d1117,%23242424,%23444444,%23777777,%23ffffff

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
